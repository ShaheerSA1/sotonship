<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nostobon: server not reachable</title>
<style>
  :root { --bg: #f5f4ef; --ink: #1b1d1a; --muted: #686c65; --accent: #1e6b47; --accent-ink: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #131412; --ink: #ecebe5; --muted: #a0a39b; --accent: #54c48c; --accent-ink: #0b0c0b; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 48px 20px; }
  .logo { font-weight: 800; font-size: 28px; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  p { color: var(--muted); }
  code { color: var(--ink); }
  button { margin-top: 12px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 12px 18px; font: inherit; font-weight: 650; }
</style>
</head>
<body>
<main>
  <div class="logo">nostobon<span>.</span></div>
  <h1>Can't reach the server</h1>
  <p>The app loads prices and plans from the Nostobon server, and it did not answer.</p>
  <p>Developing over USB? Start the server on the laptop (<code>uvicorn app.main:app</code>) and run <code>npm run reverse</code> in <code>mobile/</code>.</p>
  <button onclick="location.replace('/')">Try again</button>
</main>
</body>
</html>
